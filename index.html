<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8f2" />
  <title>おでかけMAP 福岡</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:#fffaf6;color:#292929}
    header{padding:18px 16px 12px;background:#fff;box-shadow:0 2px 12px #00000010;position:relative;z-index:1000}
    h1{font-size:21px;margin:0 0 5px} .sub{font-size:12px;color:#777}
    .tabs{display:flex;gap:8px;padding:12px;overflow-x:auto;background:#fff;position:relative;z-index:999}
    button{border:0;border-radius:999px;padding:10px 15px;font-weight:700;white-space:nowrap;background:#f2f2f2;color:#444}
    button.active{background:#ff6f91;color:#fff}
    #map{height:calc(100vh - 126px);min-height:500px}
    .popup-title{font-size:15px;font-weight:800;margin-bottom:4px}.popup-note{font-size:12px;color:#666;margin-bottom:9px}
    .gmaps{display:block;text-decoration:none;text-align:center;background:#4285f4;color:white!important;padding:8px 10px;border-radius:9px;font-weight:700}
    .leaflet-popup-content{margin:14px;width:210px!important}
  </style>
</head>
<body>
<header>
  <h1>📍 おでかけMAP 福岡</h1>
  <div class="sub">目的を選ぶだけ。気になる場所を見つけよう。</div>
</header>
<div class="tabs">
  <button class="active" data-cat="date">❤️ デート向け</button>
  <button data-cat="kids">👨‍👩‍👧 子育て向け</button>
  <button data-cat="solo">🧳 一人旅向け</button>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const spots = [
 {name:"福岡タワー",cat:"date",lat:33.5933,lng:130.3515,note:"夜景デートの定番"},
 {name:"大濠公園",cat:"date",lat:33.5861,lng:130.3764,note:"散歩やカフェ巡りに"},
 {name:"海の中道海浜公園",cat:"date",lat:33.6635,lng:130.3613,note:"のんびり一日デート"},
 {name:"門司港レトロ",cat:"date",lat:33.9477,lng:130.9610,note:"街歩きと夜景を楽しめる"},
 {name:"マリンワールド海の中道",cat:"kids",lat:33.6616,lng:130.3639,note:"家族で楽しめる水族館"},
 {name:"福岡市科学館",cat:"kids",lat:33.5772,lng:130.3780,note:"雨の日のおでかけにも"},
 {name:"海の中道海浜公園",cat:"kids",lat:33.6635,lng:130.3613,note:"広い公園でたっぷり遊べる"},
 {name:"北九州市立いのちのたび博物館",cat:"kids",lat:33.8704,lng:130.8113,note:"恐竜好きにもおすすめ"},
 {name:"太宰府天満宮",cat:"solo",lat:33.5214,lng:130.5349,note:"参道をゆっくり散策"},
 {name:"大濠公園",cat:"solo",lat:33.5861,lng:130.3764,note:"一人で散歩・休憩しやすい"},
 {name:"門司港レトロ",cat:"solo",lat:33.9477,lng:130.9610,note:"気ままな街歩きに"},
 {name:"糸島・桜井二見ヶ浦",cat:"solo",lat:33.6380,lng:130.1927,note:"海沿いドライブにも"}
];

const map = L.map('map').setView([33.5902,130.4017], 10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom:19,
 attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

let markers=[];
function showCategory(cat){
 markers.forEach(m=>map.removeLayer(m)); markers=[];
 const chosen=spots.filter(s=>s.cat===cat);
 const bounds=[];
 chosen.forEach(s=>{
   const q=encodeURIComponent(s.name);
   const marker=L.marker([s.lat,s.lng]).addTo(map);
   marker.bindPopup(`<div class="popup-title">${s.name}</div><div class="popup-note">${s.note}</div><a class="gmaps" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">Googleマップで見る</a>`);
   markers.push(marker); bounds.push([s.lat,s.lng]);
 });
 if(bounds.length) map.fitBounds(bounds,{padding:[35,35],maxZoom:11});
}
document.querySelectorAll('button[data-cat]').forEach(btn=>{
 btn.addEventListener('click',()=>{
  document.querySelectorAll('button[data-cat]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); showCategory(btn.dataset.cat);
 });
});
showCategory('date');
</script>
</body>
</html>
