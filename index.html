const APP_BUILD='20260922-solocafe75';

async function ensureLatestBuild(){
  try{
    const res=await fetch('./index.html?check='+Date.now(),{cache:'no-store'});
    const html=await res.text();
    const m=html.match(/<meta name="app-build" content="([^"]+)"/);
    const remote=m && m[1];
    if(remote && remote!==APP_BUILD){
      const url=new URL(location.href);
      url.searchParams.set('v',remote);
      location.replace(url.toString());
    }
  }catch(e){}
}
window.addEventListener('pageshow',()=>setTimeout(ensureLatestBuild,300));
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') setTimeout(ensureLatestBuild,200);
});

  "IMG_0504.jpeg",

const heroSlides = [...document.querySelectorAll('.hero-slide')];
let heroIndex = 0;
let heroLayer = 0;
let heroTimer = null;

// Preload hero images once so the next scene is already decoded before crossfade.
const heroPreload = heroImages.map(src=>{
  const img=new Image();
  img.decoding='async';
  img.src=src;
  if(img.decode) img.decode().catch(()=>{});
  return img;
});

function prepareHeroLayer(layerIndex,imageIndex){
  const layer=heroSlides[layerIndex];
  if(!layer) return;
  layer.style.backgroundImage=`url("${heroImages[imageIndex]}")`;
  layer.classList.remove('is-active');
}

function startHeroSlideshow(){
  if(!heroSlides.length || !heroImages.length) return;

  prepareHeroLayer(0,0);
  heroSlides[0].classList.add('is-active');

  if(heroImages.length<2) return;
  prepareHeroLayer(1,1);

  heroTimer=setInterval(()=>{
    const nextIndex=(heroIndex+1)%heroImages.length;
    const nextLayer=heroLayer===0?1:0;
    const currentLayer=heroLayer;

    // Inactive layer has already been prepared whenever possible.
    heroSlides[nextLayer].style.backgroundImage=`url("${heroImages[nextIndex]}")`;

    requestAnimationFrame(()=>{
      heroSlides[nextLayer].classList.add('is-active');
      heroSlides[currentLayer].classList.remove('is-active');

      heroIndex=nextIndex;
      heroLayer=nextLayer;

      const followingIndex=(heroIndex+1)%heroImages.length;
      const followingLayer=heroLayer===0?1:0;
      setTimeout(()=>{
        if(!heroSlides[followingLayer].classList.contains('is-active')){
          heroSlides[followingLayer].style.backgroundImage=`url("${heroImages[followingIndex]}")`;
        }
      },1450);
    });
  },5500);
}

startHeroSlideshow();

  +glyph+'</svg></svg></div>';
 return L.divIcon({className:'leaflet-div-icon',html,iconSize:[36,44],iconAnchor:[18,42],popupAnchor:[0,-39]});

function popupHtml(s){
 const st=styles[s.cat];
 const tags=s.tags.map(t=>`<span class="tag">${t}</span>`).join('');
 const q=encodeURIComponent(s.name);
 const eventState=s.eventStart && s.eventEnd ? getEventState(s) : '';
 const info=[
  s.area ? `<div class="popup-row"><b>エリア</b><span>${s.area}</span></div>` : '',
  eventState ? `<div class="popup-row"><b>開催状況</b><span>${eventState}</span></div>` : '',
  s.eventStart && s.eventEnd ? `<div class="popup-row"><b>開催期間</b><span>${formatEventRange(s)}</span></div>` : '',
  s.eventType ? `<div class="popup-row"><b>イベント</b><span>${s.eventType}</span></div>` : '',
  s.age ? `<div class="popup-row"><b>年齢目安</b><span>${s.age}</span></div>` : '',
  s.cat==='kids' ? `<div class="popup-row"><b>家族料金区分</b><span>${getFamilyPriceBand(s)}</span></div>` : '',
  s.price ? `<div class="popup-row"><b>料金目安</b><span>${s.price}</span></div>` : '',
  s.hours ? `<div class="popup-row"><b>営業時間</b><span>${s.hours}</span></div>` : '',
  s.closed ? `<div class="popup-row"><b>${s.eventStart ? '注意事項' : '定休日'}</b><span>${s.closed}</span></div>` : '',
  s.lastVerified ? `<div class="popup-row"><b>最終確認</b><span>${formatEventDate(s.lastVerified)}</span></div>` : '',
  s.rating ? `<div class="popup-row"><b>${s.ratingSource || '食べログ'}</b><span>★ ${s.rating}${s.reviews ? `（口コミ${s.reviews}件）` : ''}</span></div>` : '',
  s.googleRating ? `<div class="popup-row"><b>Google</b><span>★ ${s.googleRating}${s.googleReviews ? `（口コミ${s.googleReviews}件）` : ''}</span></div>` : ''
 ].join('');
 return `
  <div class="popup-visual" style="background:${st.grad}">${s.image ? `<img src="${s.image}" alt="${s.name}">` : st.emoji}</div>
  <div class="popup-title">${s.name}</div>
  <div class="tags">${tags}</div>
  <div class="popup-note">${s.note}</div>
  ${info ? `<div class="popup-info">${info}</div><div class="popup-disclaimer">営業時間・定休日・評価は変更される場合があります。最新情報は店舗・Googleマップ等でご確認ください。</div>` : ''}
  ${s.officialUrl ? `<a class="official-link" target="_blank" rel="noopener" href="${s.officialUrl}">公式情報を確認</a>` : ''}
  <a class="gmaps" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">Googleマップで見る</a>`;
}

function localDateKey(){
 const d=new Date();
 const y=d.getFullYear();
 const m=String(d.getMonth()+1).padStart(2,'0');
 const day=String(d.getDate()).padStart(2,'0');
 return `${y}-${m}-${day}`;
}

function formatEventDate(value){
 const [y,m,d]=value.split('-');
 return `${y}年${Number(m)}月${Number(d)}日`;
}

function formatEventRange(s){
 if(s.eventStart===s.eventEnd) return formatEventDate(s.eventStart);
 const [sy,sm,sd]=s.eventStart.split('-');
 const [ey,em,ed]=s.eventEnd.split('-');
 if(sy===ey && sm===em) return `${sy}年${Number(sm)}月${Number(sd)}日〜${Number(ed)}日`;
 if(sy===ey) return `${sy}年${Number(sm)}月${Number(sd)}日〜${Number(em)}月${Number(ed)}日`;
 return `${formatEventDate(s.eventStart)}〜${formatEventDate(s.eventEnd)}`;
}

function getEventState(s){
 const today=localDateKey();
 if(s.eventStatus==='中止') return '中止';
 if(s.bookingRequired && today<=s.bookingEnd) return '申込受付中';
 if(s.bookingRequired && today>s.bookingEnd) return '申込受付終了';
 if(today<s.eventStart) return '開催予定';
 if(today<=s.eventEnd) return '開催中';
 return '終了';
}

function isSpotVisible(s){
 if(!s.eventStart || !s.eventEnd) return true;
 const today=localDateKey();
 if(s.bookingRequired && s.bookingEnd && today>s.bookingEnd) return false;
 return s.eventStatus!=='中止' && today<=s.eventEnd;
}

function focusSpot(s, marker){
 map.flyTo([s.lat,s.lng],12,{duration:.55});
 marker.openPopup();
 document.getElementById('recTitle').textContent=s.name;
 document.getElementById('recMeta').textContent=s.note;
 document.getElementById('recommendCard').style.background=spotBackground(s,styles[s.cat]);
}

function spotBackground(s,st){
 return s.image ? 'linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.22)), url("' + s.image + '")' : st.grad;
}

let activeSubfilter='すべて';
let activeCafeTime='all';
let activeKidsAge='all';
let activeOutdoorType='all';
let activeAnimalType='all';
let activeLearningType='all';
let activeSeasonType='all';

function buildSubfilters(cat){
 const wrap=document.getElementById('subfilters');
 wrap.innerHTML='';
 const presets = cat==='date'
   ? ['すべて','王道','夜景','カフェ・バー','ドライブ','アクティブ・体験','雨の日','記念日']
   : cat==='kids'
   ? ['すべて','料金','雨の日','室内遊び','公園・外遊び','動物・水族館','学び・体験','季節イベント']
   : cat==='solo'
   ? ['すべて','街歩き・散策','自然・絶景','文化・学び','ひとりグルメ','カフェ・喫茶','温泉・癒し','一人ドライブ']
   : cat==='tourism'
   ? ['すべて','王道観光','歴史・文化','絶景・景色','街歩き・エリア','体験・名物','季節の定番']
   : ['すべて'];
 presets.forEach(label=>{
   const b=document.createElement('button');
   b.className='subfilter'+(label===activeSubfilter?' active':'');
   b.textContent=label;
   b.addEventListener('click',()=>{
     activeSubfilter=label;
     activeCafeTime='all';
     activeKidsAge='all';
     activeOutdoorType='all';
     activeAnimalType='all';
     activeLearningType='all';
     activeSeasonType='all';
     activeKidsPrice='all';
     buildSubfilters(cat);
     buildCafeTimeFilters(cat);
     renderCategory(cat);
   });
   wrap.appendChild(b);
 });
}

function buildCafeTimeFilters(cat){
 const wrap=document.getElementById('cafeTimeFilters');
 wrap.innerHTML='';
 const isCafe = cat==='date' && activeSubfilter==='カフェ・バー';
 const isKidsIndoor = cat==='kids' && activeSubfilter==='室内遊び';
 const isKidsOutdoor = cat==='kids' && activeSubfilter==='公園・外遊び';
 const isKidsAnimal = cat==='kids' && activeSubfilter==='動物・水族館';
 const isKidsLearning = cat==='kids' && activeSubfilter==='学び・体験';
 const isKidsSeason = cat==='kids' && activeSubfilter==='季節イベント';
 const isKidsPrice = cat==='kids' && activeSubfilter==='料金';
 wrap.classList.toggle('show',isCafe || isKidsIndoor || isKidsOutdoor || isKidsAnimal || isKidsLearning || isKidsSeason || isKidsPrice);
 if(!isCafe && !isKidsIndoor && !isKidsOutdoor && !isKidsAnimal && !isKidsLearning && !isKidsSeason && !isKidsPrice) return;
 const options = isCafe
   ? [['all','すべて'],['day','☀️ 昼カフェ'],['night','🌙 夜カフェ'],['bar','🍸 バー']]
   : isKidsIndoor
   ? [['all','すべて'],['0〜2歳','0〜2歳'],['3〜6歳','3〜6歳'],['小学生','小学生'],['全年齢','全年齢']]
   : isKidsOutdoor
   ? [['all','すべて'],['大型遊具','大型遊具'],['アスレチック','アスレチック'],['自然体験','自然体験'],['水遊び','水遊び']]
   : isKidsAnimal
   ? [['all','すべて'],['水族館','水族館'],['動物園','動物園'],['ふれあい・牧場','ふれあい・牧場']]
   : isKidsLearning
   ? [['all','すべて'],['科学・自然','科学・自然'],['ものづくり','ものづくり'],['仕事・社会','仕事・社会'],['歴史・文化','歴史・文化'],['食・農業','食・農業']]
   : isKidsSeason
   ? [['all','すべて'],['春','春'],['夏','夏'],['秋','秋'],['冬','冬']]
   : [['all','すべて'],['無料','無料'],['〜1,000円','〜1,000円'],['〜3,000円','〜3,000円'],['〜5,000円','〜5,000円'],['5,000円以上','5,000円以上'],['要確認','要確認']];
 options.forEach(([value,label])=>{
   const b=document.createElement('button');
   const activeValue = isCafe ? activeCafeTime : isKidsIndoor ? activeKidsAge : isKidsOutdoor ? activeOutdoorType : isKidsAnimal ? activeAnimalType : isKidsLearning ? activeLearningType : isKidsSeason ? activeSeasonType : activeKidsPrice;
   b.className='cafetime'+(activeValue===value?' active':'');
   b.textContent=label;
   b.addEventListener('click',()=>{
     if(isCafe) activeCafeTime=value;
     else if(isKidsIndoor) activeKidsAge=value;
     else if(isKidsOutdoor) activeOutdoorType=value;
     else if(isKidsAnimal) activeAnimalType=value;
     else if(isKidsLearning) activeLearningType=value;
     else if(isKidsSeason) activeSeasonType=value;
     else activeKidsPrice=value;
     buildCafeTimeFilters(cat);
     renderCategory(cat);
   });
   wrap.appendChild(b);
 });
}

function renderCategory(cat){
 markers.forEach(m=>map.removeLayer(m)); markers=[];
 let chosen=spots.filter(s=>s.cat===cat && isSpotVisible(s));
 if(activeSubfilter!=='すべて'){
   if(activeSubfilter==='カフェ・バー'){
     chosen=chosen.filter(s=>s.tags.includes('カフェ') || s.tags.includes('バー'));
   } else if(activeSubfilter!=='料金') {
     chosen=chosen.filter(s=>s.tags.includes(activeSubfilter));
   }
 }
 if(activeSubfilter==='カフェ・バー' && activeCafeTime!=='all'){
   chosen=chosen.filter(s=>Array.isArray(s.time) && s.time.includes(activeCafeTime));
 }
 if(cat==='kids' && activeSubfilter==='室内遊び' && activeKidsAge!=='all'){
   chosen=chosen.filter(s=>Array.isArray(s.ageGroups) && s.ageGroups.includes(activeKidsAge));
 }
 if(cat==='kids' && activeSubfilter==='公園・外遊び' && activeOutdoorType!=='all'){
   chosen=chosen.filter(s=>s.tags.includes(activeOutdoorType));
 }
 if(cat==='kids' && activeSubfilter==='動物・水族館' && activeAnimalType!=='all'){
   chosen=chosen.filter(s=>s.tags.includes(activeAnimalType));
 }
 if(cat==='kids' && activeSubfilter==='学び・体験' && activeLearningType!=='all'){
   chosen=chosen.filter(s=>s.tags.includes(activeLearningType));
 }
 if(cat==='kids' && activeSubfilter==='季節イベント' && activeSeasonType!=='all'){
   chosen=chosen.filter(s=>s.tags.includes(activeSeasonType));
 }
 if(cat==='kids' && activeSubfilter==='料金' && activeKidsPrice!=='all'){
   chosen=chosen.filter(s=>getFamilyPriceBand(s)===activeKidsPrice);
 }
 if(cat==='kids' && activeSubfilter==='季節イベント'){
   chosen.sort((a,b)=>(a.eventStart || '').localeCompare(b.eventStart || ''));
 }
 if(cat==='kids' && activeSubfilter==='料金'){
   const order=['無料','〜1,000円','〜3,000円','〜5,000円','5,000円以上','要確認'];
   chosen.sort((a,b)=>order.indexOf(getFamilyPriceBand(a))-order.indexOf(getFamilyPriceBand(b)));
 }
 const st=styles[cat];
 document.getElementById('spotCount').textContent=`${chosen.length}スポット`;
 document.getElementById('categoryLabel').textContent=st.label;

 if(chosen[0]){
   document.getElementById('recommendCard').style.background=spotBackground(chosen[0],st);
   document.getElementById('recBadge').textContent=`${st.emoji} ${st.label.replace('向け','')}`;
   document.getElementById('recTitle').textContent=chosen[0].name;
   document.getElementById('recMeta').textContent=chosen[0].note;
 } else if(cat==='kids' && activeSubfilter==='季節イベント'){
   document.getElementById('recommendCard').style.background=st.grad;
   document.getElementById('recBadge').textContent='開催情報';
   document.getElementById('recTitle').textContent='現在掲載中のイベントはありません';
   document.getElementById('recMeta').textContent='公式発表を確認できたイベントから順次掲載します。';
 }

 const strip=document.getElementById('bottomStrip');
 strip.innerHTML='';
 const bounds=[];

 chosen.forEach((s,i)=>{
  const marker=L.marker([s.lat,s.lng],{icon:makeIcon(s)}).addTo(map);
  marker.bindPopup(popupHtml(s));
  marker.on('click',()=>{
    document.getElementById('recTitle').textContent=s.name;
    document.getElementById('recMeta').textContent=s.note;
    document.getElementById('recommendCard').style.background=spotBackground(s,styles[s.cat]);
  });
  markers.push(marker); bounds.push([s.lat,s.lng]);

  const card=document.createElement('button');
  card.className='mini-card';
  const miniMeta=cat==='kids' && activeSubfilter==='料金'
   ? `家族料金目安：${getFamilyPriceBand(s)}`
   : s.eventStart
   ? `${formatEventRange(s)}｜${getEventState(s)}`
   : s.tags.join('・');
  card.innerHTML=`<div class="mini-photo">${s.image ? `<img src="${s.image}" alt="${s.name}">` : styles[s.cat].emoji}</div><div class="mini-body"><div class="mini-title">${s.name}</div><div class="mini-meta">${miniMeta}</div></div>`;
  card.addEventListener('click',()=>focusSpot(s,marker));
  strip.appendChild(card);
 });

 if(bounds.length) map.fitBounds(bounds,{paddingTopLeft:[42,145],paddingBottomRight:[42,70],maxZoom:11});
}

 activeSubfilter='すべて';
 activeCafeTime='all';
 activeKidsAge='all';
 activeOutdoorType='all';
 activeAnimalType='all';
 activeLearningType='all';
 activeSeasonType='all';
 activeKidsPrice='all';
 document.getElementById('mapHeadTitle').textContent=styles[cat].label;
 buildSubfilters(cat);
 buildCafeTimeFilters(cat);
 renderCategory(cat);
}

document.querySelectorAll('.chip').forEach(btn=>{
 btn.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  showCategory(btn.dataset.cat);
 });
});

const toast=document.getElementById('toast');
function showToast(message){
 toast.textContent=message;toast.classList.add('show');
 clearTimeout(window.__toastTimer);
 window.__toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);
}

document.getElementById('locateBtn').addEventListener('click',()=>{
 if(!navigator.geolocation){showToast('現在地取得に対応していません');return;}
 showToast('現在地を取得中…');
 navigator.geolocation.getCurrentPosition(pos=>{
  const {latitude,longitude,accuracy}=pos.coords;
  if(userMarker) map.removeLayer(userMarker);
  if(userAccuracy) map.removeLayer(userAccuracy);
  userAccuracy=L.circle([latitude,longitude],{radius:accuracy,color:'#4f8cff',weight:1,fillColor:'#4f8cff',fillOpacity:.08}).addTo(map);
  userMarker=L.circleMarker([latitude,longitude],{radius:8,color:'#fff',weight:4,fillColor:'#4285f4',fillOpacity:1}).addTo(map);
  map.setView([latitude,longitude],13,{animate:true});
  showToast('現在地を表示しました');
 },()=>showToast('位置情報を許可すると現在地を表示できます'),{enableHighAccuracy:true,timeout:8000,maximumAge:60000});
});

function openMap(cat){
 document.getElementById('homeScreen').classList.add('hidden');
 document.getElementById('mapScreen').classList.remove('hidden');
 document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));

 // iPhoneのホーム画面Webアプリでは、非表示中にLeafletを描画すると
 // タイルが真っ白になることがあるため、表示後にサイズ確定→描画する。
 requestAnimationFrame(()=>{
   requestAnimationFrame(()=>{
     map.invalidateSize(true);
     showCategory(cat);
     setTimeout(()=>{
       map.invalidateSize(true);
       map.eachLayer(layer=>{
         if(layer && typeof layer.redraw==='function') layer.redraw();
       });
     },220);
   });
 });
}

document.querySelectorAll('[data-go]').forEach(btn=>btn.addEventListener('click',()=>openMap(btn.dataset.go)));
document.querySelectorAll('[data-soon]').forEach(btn=>btn.addEventListener('click',()=>showToast(btn.dataset.soon+'は次のアップデートで追加予定')));
document.getElementById('backBtn').addEventListener('click',()=>{
 document.getElementById('mapScreen').classList.add('hidden');
 document.getElementById('homeScreen').classList.remove('hidden');
});

// 初期状態はホーム画面なので、地図の本描画は openMap() 時に行う。
window.addEventListener('pageshow',()=>{
  if(!document.getElementById('mapScreen').classList.contains('hidden')){
    setTimeout(()=>{
      map.invalidateSize(true);
      map.eachLayer(layer=>{
        if(layer && typeof layer.redraw==='function') layer.redraw();
      });
    },180);
  }
});

if (window.matchMedia('(max-width: 600px)').matches) {
  const zoom = document.querySelector('.leaflet-control-zoom');
  if (zoom) zoom.style.display = 'none';
}
</script>
</body>
</html>
