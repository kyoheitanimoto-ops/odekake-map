<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="app-build" content="20260920-herofinal34" />
  <meta name="theme-color" content="#fffafc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>おでかけMAP 福岡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Yomogi&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    :root{
      --bg:#fffafc;
      --card:#fff;
      --text:#17171c;
      --muted:#7a7a86;
      --line:#ececf2;
      --shadow:0 16px 40px rgba(30,20,40,.12);
      --pink:#ff5f8f;
      --blue:#4f8cff;
      --violet:#7a67ee;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Noto Sans JP",sans-serif;
      background:linear-gradient(180deg,#fff8fb 0%,#f6f7fb 42%,#f5f6fa 100%);
      color:var(--text);
      overflow:hidden;
    }
    .app{height:100%;max-width:760px;margin:0 auto;position:relative}.screen{height:100%;display:flex;flex-direction:column}.hidden{display:none!important}
    .top{
      padding:calc(10px + env(safe-area-inset-top)) 16px 4px;
      position:relative;
    }
    .top:after{
      content:"";
      position:absolute;right:-30px;top:-45px;width:150px;height:150px;border-radius:50%;
      background:radial-gradient(circle,#ffd7e5 0%,rgba(255,215,229,0) 70%);
      pointer-events:none;
    }
    .eyebrow{font-size:11px;font-weight:800;color:var(--pink);letter-spacing:.14em;margin-bottom:6px}
    h1{font-size:28px;line-height:1.08;margin:0;letter-spacing:-.04em}
    .sub{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.45}
    .chips{display:flex;gap:8px;overflow-x:auto;padding:7px 12px 7px;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chip{
      border:1px solid var(--line);border-radius:999px;padding:11px 15px;font-size:14px;font-weight:800;
      white-space:nowrap;background:rgba(255,255,255,.92);color:#444;box-shadow:0 4px 12px rgba(20,20,40,.05);min-height:40px
    }
    .chip.active{color:#fff;border-color:transparent;background:#17171c;transform:translateY(-1px)}
    .recommend-wrap{padding:0 12px 8px}
    .recommend-card{
      border-radius:22px;padding:0;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;
      background:linear-gradient(135deg,#ff6a98 0%,#ff8e73 100%);
      min-height:126px;background-size:cover!important;background-position:center!important;
    }
    .recommend-overlay{
      min-height:126px;padding:14px 15px;display:flex;flex-direction:column;justify-content:flex-end;
      background:linear-gradient(180deg,rgba(0,0,0,.05) 10%,rgba(0,0,0,.62) 100%);position:relative;z-index:1;
    }
    .recommend-card:after{display:none}
    .rec-kicker{font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.88}
    .rec-main{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:5px}
    .rec-title{font-size:18px;font-weight:900;line-height:1.2;text-shadow:0 1px 8px rgba(0,0,0,.22)}
    .rec-meta{font-size:11px;opacity:.9;margin-top:5px}
    .rec-badge{background:rgba(255,255,255,.2);backdrop-filter:blur(10px);padding:9px 11px;border-radius:14px;font-size:11px;font-weight:800;white-space:nowrap}
    .map-shell{
      position:relative;flex:1;min-height:300px;margin:0 10px calc(8px + env(safe-area-inset-bottom));border-radius:24px;overflow:hidden;
      background:#e9e9ef;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.85)
    }
    #map{position:absolute;inset:0}
    .map-toolbar{
      position:absolute;top:12px;left:12px;right:12px;z-index:500;display:flex;justify-content:space-between;gap:8px;pointer-events:none
    }
    .glass{
      pointer-events:auto;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border-radius:999px;padding:9px 12px;font-size:12px;font-weight:850;box-shadow:0 8px 24px rgba(0,0,0,.10)
    }
    .floating{
      position:absolute;right:12px;bottom:14px;z-index:500;width:48px;height:48px;border:none;border-radius:16px;
      background:rgba(255,255,255,.96);box-shadow:0 8px 24px rgba(0,0,0,.16);display:grid;place-items:center;font-size:20px;color:#222
    }
    .pin{
      width:42px;height:42px;border-radius:50% 50% 50% 12px;transform:rotate(-45deg);
      display:grid;place-items:center;border:3px solid #fff
    }
    .pin span{transform:rotate(45deg);font-size:16px}
    .leaflet-div-icon{background:transparent!important;border:none!important}
    .leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.72)!important}
    .leaflet-popup-content-wrapper{border-radius:20px!important;box-shadow:0 16px 38px rgba(0,0,0,.16)!important;padding:2px!important}
    .leaflet-popup-content{margin:14px!important;width:245px!important}
    .popup-visual{
      height:104px;border-radius:14px;margin-bottom:11px;overflow:hidden;display:flex;align-items:center;justify-content:center;
      font-size:26px;font-weight:900;background:linear-gradient(135deg,#ff7da5,#ff9a7a)
    }
    .popup-visual img{width:100%;height:100%;object-fit:cover;display:block}
    .popup-title{font-size:16px;font-weight:900;letter-spacing:-.02em;margin-bottom:6px}
    .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .tag{font-size:10px;font-weight:800;background:#f4f4f7;color:#5c5c66;padding:5px 7px;border-radius:999px}
    .popup-note{font-size:12px;line-height:1.6;color:var(--muted);margin-bottom:10px}
    .popup-info{display:grid;gap:6px;margin:8px 0 11px}
    .popup-row{display:flex;gap:7px;align-items:flex-start;font-size:11px;line-height:1.45;color:#4f4f59}
    .popup-row b{color:#222;font-weight:850;min-width:58px}
    .popup-disclaimer{font-size:9px;color:#9a9aa4;line-height:1.4;margin-top:-3px;margin-bottom:10px}
    .gmaps{display:block;text-decoration:none;text-align:center;color:#fff!important;background:#111116;padding:11px 12px;border-radius:12px;font-weight:850;font-size:13px}
    .bottom-strip{
      position:absolute;left:10px;right:68px;bottom:12px;z-index:490;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px
    }
    .bottom-strip::-webkit-scrollbar{display:none}
    .mini-card{
      min-width:148px;max-width:148px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border:none;border-radius:16px;padding:0;text-align:left;
      overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.12)
    }
    .mini-photo{height:62px;background:#ececf2;display:flex;align-items:center;justify-content:center;font-size:24px}
    .mini-photo img{width:100%;height:100%;object-fit:cover;display:block}
    .mini-body{padding:8px 10px}
    .mini-title{font-size:12px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mini-meta{font-size:10px;color:var(--muted);margin-top:4px}
    .toast{
      position:absolute;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);z-index:800;background:#111116;color:#fff;
      padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .home{background:#fff;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top)}
    .home-hero{
      height:55%;min-height:360px;position:relative;display:flex;align-items:flex-end;
      overflow:hidden;background:#dfe7ee
    }
    .hero-slides{position:absolute;inset:0}
    .hero-slide{
      position:absolute;
      inset:-3%;
      background-position:center;
      background-size:cover;
      opacity:0;
      transform:scale(1.035);
      transition:opacity 1.35s ease-in-out,transform 6s linear;
      will-change:opacity,transform;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      transform-origin:center center
    }
    .hero-slide.is-active{
      opacity:1;
      transform:scale(1.08)
    }
to{transform:scale(1.08)}}
    .home-hero:after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(
        180deg,
        rgba(255,255,255,.04) 0%,
        rgba(255,255,255,0) 55%,
        rgba(18,40,62,.06) 100%
      );
      z-index:1;
      pointer-events:none
    }
    .hero-copy{
      position:absolute;
      top:58px;
      left:24px;
      z-index:2;
      color:#17314b;
      background:none;
      padding:0;
      border-radius:0;
      box-shadow:none;
      max-width:none;
      -webkit-backdrop-filter:none;
      backdrop-filter:none;
      text-shadow:none
    }
    .hero-copy h2{
      font-family:"Yomogi","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
      font-size:21px;
      line-height:1.2;
      margin:0;
      font-weight:400;
      letter-spacing:.015em;
      color:#17314b;
      white-space:nowrap;
      transform:rotate(-4deg);
      transform-origin:left center;
      text-shadow:
        0 1px 2px rgba(255,255,255,.70),
        0 0 5px rgba(255,255,255,.35)
    }
    .hero-copy p{
      font-family:"Yomogi","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
      font-size:11.5px;
      line-height:1.75;
      margin:17px 0 0 52px;
      font-weight:600;
      letter-spacing:.025em;
      color:#2f465d;
      transform:rotate(-2deg);
      transform-origin:left center;
      -webkit-text-stroke:.12px currentColor;
      text-shadow:
        0 1px 2px rgba(255,255,255,.75),
        0 0 5px rgba(255,255,255,.32)
    }
    .hero-copy h2 br{display:block}
    @media (max-width:380px){
      .hero-copy{top:54px;left:20px}
      .hero-copy h2{font-size:20px}
      .hero-copy p{font-size:11px;margin-left:48px}
    }
    .purpose-sheet{
      position:relative;z-index:4;flex:1;background:#fff;margin-top:-28px;border-radius:30px 30px 0 0;
      padding:22px 18px calc(92px + env(safe-area-inset-bottom));
      box-shadow:0 -12px 30px rgba(35,55,80,.08)
    }
    .purpose-title{text-align:center;font-size:16px;font-weight:900;margin:0 0 17px;color:#17171c}
    .purpose-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .purpose{
      border:0;border-radius:18px;min-height:112px;padding:14px 6px 12px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
      font-weight:850;color:#30303a;font-size:12px;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.018)
    }
    .purpose-icon{width:38px;height:38px;display:grid;place-items:center}
    .purpose-icon svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:2.15;stroke-linecap:round;stroke-linejoin:round}
    .purpose-label{display:block;line-height:1.2}
    .purpose.date{background:#fff0f4;color:#ef5d82}
    .purpose.kids{background:#fff3e7;color:#f08a42}
    .purpose.solo{background:#edf8ef;color:#4da466}
    .purpose.soon1{background:#f5efff;color:#8057bd}
    .purpose.soon2{background:#eef6ff;color:#4f91c6}
    .purpose.soon3{background:#fff7dc;color:#e2a92f}
    .home-nav{
      position:absolute;z-index:8;left:0;right:0;bottom:0;
      height:calc(72px + env(safe-area-inset-bottom));padding:8px 26px env(safe-area-inset-bottom);
      background:rgba(255,255,255,.98);border-top:1px solid #eceff3;
      display:grid;grid-template-columns:repeat(3,1fr);align-items:start
    }
    .home-nav-item{
      border:0;background:transparent;color:#a3a9b1;display:flex;flex-direction:column;
      align-items:center;gap:4px;font-size:10px;font-weight:750;padding:0
    }
    .home-nav-item.active{color:#2589e8}
    .home-nav-icon{width:25px;height:25px;display:grid;place-items:center}
    .home-nav-icon svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    @media (max-height:760px){
      .home-hero{height:49%;min-height:310px}
      
      .purpose{min-height:96px}
    }
    .map-head{display:flex;align-items:center;gap:10px;padding:calc(9px + env(safe-area-inset-top)) 14px 2px}
    .back-btn{border:0;background:#fff;width:38px;height:38px;border-radius:13px;font-size:22px;box-shadow:0 5px 16px rgba(0,0,0,.08)}
    .map-head-title{font-size:17px;font-weight:900;flex:1;text-align:center;margin-right:48px}
    /* Immersive discovery map */
    #mapScreen{position:relative;background:#f4f6f8}
    #mapScreen .map-head{position:absolute;z-index:700;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
    #mapScreen .back-btn{pointer-events:auto;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);width:42px;height:42px;border-radius:50%;font-size:25px}
    #mapScreen .map-head-title{pointer-events:auto;flex:0 0 auto;margin:0 0 0 4px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:11px 15px;border-radius:999px;font-size:14px;box-shadow:0 5px 16px rgba(0,0,0,.08)}
    #mapScreen .top,#mapScreen .chips,#mapScreen .recommend-wrap{display:none}
    #mapScreen .map-shell{position:absolute;inset:0;margin:0;border-radius:0;border:0;min-height:0;box-shadow:none}
    #mapScreen .map-toolbar{top:calc(64px + env(safe-area-inset-top));left:12px;right:auto}
    .subfilters{position:absolute;z-index:690;top:calc(108px + env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
    .subfilters::-webkit-scrollbar{display:none}
    .subfilter{border:0;border-radius:999px;padding:8px 11px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:11px;font-weight:850;color:#555;white-space:nowrap;box-shadow:0 5px 14px rgba(0,0,0,.08)}
    .subfilter.active{background:#111116;color:#fff}
    .cafefilters{position:absolute;z-index:689;top:calc(147px + env(safe-area-inset-top));left:12px;display:none;gap:7px}
    .cafefilters.show{display:flex}
    .cafetime{border:0;border-radius:999px;padding:8px 12px;background:rgba(255,255,255,.96);font-size:11px;font-weight:850;color:#555;box-shadow:0 5px 14px rgba(0,0,0,.08)}
    .cafetime.active{background:#ff5f8f;color:#fff}
    #mapScreen #categoryLabel{display:none}
    #mapScreen .glass{padding:8px 11px;font-size:11px;background:rgba(255,255,255,.9)}
    #mapScreen .bottom-strip{display:none}
    #mapScreen .floating{right:14px;bottom:calc(18px + env(safe-area-inset-bottom));width:50px;height:50px;border-radius:50%}
    #mapScreen .pin{width:34px;height:34px;border-width:2px;box-shadow:0 4px 12px rgba(0,0,0,.18)!important}
    #mapScreen .pin span{font-size:13px}
    #mapScreen .leaflet-popup-content-wrapper{border-radius:22px!important}
    #mapScreen .leaflet-popup-content{width:226px!important;margin:11px!important}
    #mapScreen .popup-visual{height:118px;margin-bottom:10px}
    #mapScreen .leaflet-tile-pane{filter:saturate(.62) brightness(1.08) contrast(.90)}
    #mapScreen .leaflet-control-attribution{opacity:.62}
  </style>
</head>
<body>
<div class="app">
  <section class="screen home" id="homeScreen">
    <div class="home-hero">
      <div class="hero-slides" aria-hidden="true">
        <div class="hero-slide is-active"></div>
        <div class="hero-slide"></div>
      </div>
      <div class="hero-copy">
        <h2>今日は、どこへいこう？</h2>
        <p>いつもの日を、<br>ちょっと特別に。</p>
      </div>
    </div>

    <div class="purpose-sheet">
      <div class="purpose-title">目的を選んでください</div>
      <div class="purpose-grid">
        <button class="purpose date" data-go="date">
          <span class="purpose-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.6 4.2 13A5.3 5.3 0 0 1 11.7 5.5L12 5.8l.3-.3A5.3 5.3 0 0 1 19.8 13Z" fill="currentColor" stroke="none"/></svg></span>
          <span class="purpose-label">デート向け</span>
        </button>
        <button class="purpose kids" data-go="kids">
          <span class="purpose-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="2.4"/><circle cx="5.8" cy="9" r="1.8"/><circle cx="18.2" cy="9" r="1.8"/><path d="M8.5 20v-5.2c0-2 1.5-3.6 3.5-3.6s3.5 1.6 3.5 3.6V20M2.8 19v-4c0-1.7 1.3-3 3-3 1 0 1.9.5 2.5 1.2M21.2 19v-4c0-1.7-1.3-3-3-3-1 0-1.9.5-2.5 1.2"/></svg></span>
          <span class="purpose-label">子育て向け</span>
        </button>
        <button class="purpose solo" data-go="solo">
          <span class="purpose-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20 10.2 6.5 14 13l2.1-3.5L21 20Z"/><path d="m8.2 10.2 2 1.7 1.7-2"/></svg></span>
          <span class="purpose-label">一人旅向け</span>
        </button>
        <button class="purpose soon1" data-soon="観光・定番">
          <span class="purpose-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h3l1.3-2h7.4l1.3 2h3a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9.5a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13.5" r="4"/></svg></span>
          <span class="purpose-label">観光・定番</span>
        </button>
        <button class="purpose soon2" data-soon="カフェ・グルメ">
          <span class="purpose-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h13v8a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5Z"/><path d="M17 8h1.5a3 3 0 0 1 0 6H17M3 21h16"/></svg></span>
          <span class="purpose-label">カフェ・グルメ</span>
        </button>
        <button class="purpose soon3" data-soon="その他">
          <span class="purpose-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.9-5.4 2.9 1-6-4.4-4.3 6.1-.9Z" fill="currentColor" stroke="none"/></svg></span>
          <span class="purpose-label">その他</span>
        </button>
      </div>
    </div>

    <nav class="home-nav" aria-label="メインナビゲーション">
      <button class="home-nav-item active" type="button">
        <span class="home-nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H6V10"/><path d="M9 20v-6h6v6"/></svg></span>
        <span>ホーム</span>
      </button>
      <button class="home-nav-item" type="button" data-soon="お気に入り">
        <span class="home-nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.6 4.2 13A5.3 5.3 0 0 1 11.7 5.5L12 5.8l.3-.3A5.3 5.3 0 0 1 19.8 13Z"/></svg></span>
        <span>お気に入り</span>
      </button>
      <button class="home-nav-item" type="button" data-soon="設定">
        <span class="home-nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.8 1.8 0 0 0 .36 2l.06.06-2.76 2.76-.06-.06a1.8 1.8 0 0 0-2-.36 1.8 1.8 0 0 0-1.1 1.65V21h-3.9v-.08A1.8 1.8 0 0 0 8.9 19.3a1.8 1.8 0 0 0-2 .36l-.06.06-2.76-2.76.06-.06a1.8 1.8 0 0 0 .36-2 1.8 1.8 0 0 0-1.65-1.1H2.8V10h.08A1.8 1.8 0 0 0 4.5 8.9a1.8 1.8 0 0 0-.36-2l-.06-.06 2.76-2.76.06.06a1.8 1.8 0 0 0 2 .36A1.8 1.8 0 0 0 10 2.85V2.8h3.9v.08A1.8 1.8 0 0 0 15 4.5a1.8 1.8 0 0 0 2-.36l.06-.06 2.76 2.76-.06.06a1.8 1.8 0 0 0-.36 2 1.8 1.8 0 0 0 1.65 1.1h.08v3.9h-.08A1.8 1.8 0 0 0 19.4 15Z"/></svg></span>
        <span>設定</span>
      </button>
    </nav>
  </section>

  <section class="screen hidden" id="mapScreen">
  <div class="map-head"><button class="back-btn" id="backBtn" aria-label="ホームへ戻る">‹</button><div class="map-head-title" id="mapHeadTitle">デート向け</div></div>
  <div class="top">

const APP_BUILD='20260920-herofinal34';

async function ensureLatestBuild(){
  try{
    const res=await fetch('./index.html?check='+Date.now(),{cache:'no-store'});
    const html=await res.text();
    const m=html.match(/<meta name="app-build" content="([^"]+)"/);
    const remote=m && m[1];
    if(remote && remote!==APP_BUILD){
      const url=new URL(location.href);
      url.searchParams.set('v',remote);
      location.replace(url.toString());
    }
  }catch(e){}
}
window.addEventListener('pageshow',()=>setTimeout(ensureLatestBuild,300));
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') setTimeout(ensureLatestBuild,200);
});

const heroSlides = [...document.querySelectorAll('.hero-slide')];
let heroIndex = 0;
let heroLayer = 0;
let heroTimer = null;

// Preload hero images once so the next scene is already decoded before crossfade.
const heroPreload = heroImages.map(src=>{
  const img=new Image();
  img.decoding='async';
  img.src=src;
  if(img.decode) img.decode().catch(()=>{});
  return img;
});

function prepareHeroLayer(layerIndex,imageIndex){
  const layer=heroSlides[layerIndex];
  if(!layer) return;
  layer.style.backgroundImage=`url("${heroImages[imageIndex]}")`;
  layer.classList.remove('is-active');
}

function startHeroSlideshow(){
  if(!heroSlides.length || !heroImages.length) return;

  prepareHeroLayer(0,0);
  heroSlides[0].classList.add('is-active');

  if(heroImages.length<2) return;
  prepareHeroLayer(1,1);

  heroTimer=setInterval(()=>{
    const nextIndex=(heroIndex+1)%heroImages.length;
    const nextLayer=heroLayer===0?1:0;
    const currentLayer=heroLayer;

    // Inactive layer has already been prepared whenever possible.
    heroSlides[nextLayer].style.backgroundImage=`url("${heroImages[nextIndex]}")`;

    requestAnimationFrame(()=>{
      heroSlides[nextLayer].classList.add('is-active');
      heroSlides[currentLayer].classList.remove('is-active');

      heroIndex=nextIndex;
      heroLayer=nextLayer;

      const followingIndex=(heroIndex+1)%heroImages.length;
      const followingLayer=heroLayer===0?1:0;
      setTimeout(()=>{
        if(!heroSlides[followingLayer].classList.contains('is-active')){
          heroSlides[followingLayer].style.backgroundImage=`url("${heroImages[followingIndex]}")`;
        }
      },1450);
    });
  },5500);
}

startHeroSlideshow();

function spotVisual(s){
 const tags=s.tags||[];
 if(tags.includes('乗馬')) return {emoji:'🐎',color:'#8b6b4d'};
 if(tags.includes('SUP')) return {emoji:'🏄',color:'#3c97b8'};
 if(tags.includes('釣り')) return {emoji:'🎣',color:'#3f7da3'};
 if(tags.includes('陶芸')) return {emoji:'🏺',color:'#9a6f5a'};
 if(tags.includes('アスレチック')) return {emoji:'🧗',color:'#5f8b56'};
 if(tags.includes('グランピング') || tags.includes('宿泊')) return {emoji:'⛺',color:'#5f7f52'};
 if(tags.includes('いちご狩り')) return {emoji:'🍓',color:'#d95d6a'};
 if(tags.includes('スパ')) return {emoji:'♨️',color:'#4f8ea8'};
 if(tags.includes('科学館')) return {emoji:'🔬',color:'#5576c7'};
 if(tags.includes('美術館') || tags.includes('博物館')) return {emoji:'🖼️',color:'#8a6aa8'};
 if(tags.includes('レストラン')) return {emoji:'🍽️',color:'#b65f78'};
 if(tags.includes('バー')) return {emoji:'🍸',color:'#7457c8'};
 if(tags.includes('カフェ')) return {emoji:'☕',color:'#5aa6a0'};
 if(tags.includes('夜景')) return {emoji:'🌙',color:'#344a78'};
 if(tags.includes('ショッピング')) return {emoji:'🛍️',color:'#e56c91'};
 if(tags.includes('水族館')) return {emoji:'🐬',color:'#3a91d8'};
 if(tags.includes('動物園')) return {emoji:'🦁',color:'#d4933f'};
 if(tags.includes('映画')) return {emoji:'🎬',color:'#686873'};
 if(tags.includes('ドライブ')) return {emoji:'🚗',color:'#4f9569'};
 return {emoji:styles[s.cat].emoji,color:styles[s.cat].color};
}

function makeIcon(s){
 const v=spotVisual(s);
 return L.divIcon({
  className:'leaflet-div-icon',
  html:`<div class="pin" style="background:${v.color};box-shadow:0 7px 18px ${v.color}66"><span>${v.emoji}</span></div>`,
  iconSize:[34,34],iconAnchor:[17,31],popupAnchor:[0,-28]
 });
}

function popupHtml(s){
 const st=styles[s.cat];
 const tags=s.tags.map(t=>`<span class="tag">${t}</span>`).join('');
 const q=encodeURIComponent(s.name);
 const info=[
  s.area ? `<div class="popup-row"><b>エリア</b><span>${s.area}</span></div>` : '',
  s.hours ? `<div class="popup-row"><b>営業時間</b><span>${s.hours}</span></div>` : '',
  s.closed ? `<div class="popup-row"><b>定休日</b><span>${s.closed}</span></div>` : '',
  s.rating ? `<div class="popup-row"><b>食べログ</b><span>★ ${s.rating}${s.reviews ? `（口コミ${s.reviews}件）` : ''}</span></div>` : ''
 ].join('');
 return `
  <div class="popup-visual" style="background:${st.grad}">${s.image ? `<img src="${s.image}" alt="${s.name}">` : st.emoji}</div>
  <div class="popup-title">${s.name}</div>
  <div class="tags">${tags}</div>
  <div class="popup-note">${s.note}</div>
  ${info ? `<div class="popup-info">${info}</div><div class="popup-disclaimer">営業時間・定休日・評価は変更される場合があります。最新情報は店舗・Googleマップ等でご確認ください。</div>` : ''}
  <a class="gmaps" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">Googleマップで見る</a>`;
}

function focusSpot(s, marker){
 map.flyTo([s.lat,s.lng],12,{duration:.55});
 marker.openPopup();
 document.getElementById('recTitle').textContent=s.name;
 document.getElementById('recMeta').textContent=s.note;
 document.getElementById('recommendCard').style.background=spotBackground(s,styles[s.cat]);
}

function spotBackground(s,st){
 return s.image ? 'linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.22)), url("' + s.image + '")' : st.grad;
}

let activeSubfilter='すべて';
let activeCafeTime='all';

function buildSubfilters(cat){
 const wrap=document.getElementById('subfilters');
 wrap.innerHTML='';
 const presets = cat==='date'
   ? ['すべて','王道','夜景','カフェ・バー','ドライブ','アクティブ・体験','雨の日','記念日']
   : ['すべて'];
 presets.forEach(label=>{
   const b=document.createElement('button');
   b.className='subfilter'+(label===activeSubfilter?' active':'');
   b.textContent=label;
   b.addEventListener('click',()=>{
     activeSubfilter=label;
     activeCafeTime='all';
     buildSubfilters(cat);
     buildCafeTimeFilters(cat);
     renderCategory(cat);
   });
   wrap.appendChild(b);
 });
}

function buildCafeTimeFilters(cat){
 const wrap=document.getElementById('cafeTimeFilters');
 wrap.innerHTML='';
 wrap.classList.toggle('show',cat==='date' && activeSubfilter==='カフェ・バー');
 if(cat!=='date' || activeSubfilter!=='カフェ・バー') return;
 [
   ['all','すべて'],
   ['day','☀️ 昼カフェ'],
   ['night','🌙 夜カフェ'],
   ['bar','🍸 バー']
 ].forEach(([value,label])=>{
   const b=document.createElement('button');
   b.className='cafetime'+(activeCafeTime===value?' active':'');
   b.textContent=label;
   b.addEventListener('click',()=>{
     activeCafeTime=value;
     buildCafeTimeFilters(cat);
     renderCategory(cat);
   });
   wrap.appendChild(b);
 });
}

function renderCategory(cat){
 markers.forEach(m=>map.removeLayer(m)); markers=[];
 let chosen=spots.filter(s=>s.cat===cat);
 if(activeSubfilter!=='すべて'){
   if(activeSubfilter==='カフェ・バー'){
     chosen=chosen.filter(s=>s.tags.includes('カフェ') || s.tags.includes('バー'));
   } else {
     chosen=chosen.filter(s=>s.tags.includes(activeSubfilter));
   }
 }
 if(activeSubfilter==='カフェ・バー' && activeCafeTime!=='all'){
   chosen=chosen.filter(s=>Array.isArray(s.time) && s.time.includes(activeCafeTime));
 }
 const st=styles[cat];
 document.getElementById('spotCount').textContent=`${chosen.length}スポット`;
 document.getElementById('categoryLabel').textContent=st.label;

 if(chosen[0]){
   document.getElementById('recommendCard').style.background=spotBackground(chosen[0],st);
   document.getElementById('recBadge').textContent=`${st.emoji} ${st.label.replace('向け','')}`;
   document.getElementById('recTitle').textContent=chosen[0].name;
   document.getElementById('recMeta').textContent=chosen[0].note;
 }

 const strip=document.getElementById('bottomStrip');
 strip.innerHTML='';
 const bounds=[];

 chosen.forEach((s,i)=>{
  const marker=L.marker([s.lat,s.lng],{icon:makeIcon(s)}).addTo(map);
  marker.bindPopup(popupHtml(s));
  marker.on('click',()=>{
    document.getElementById('recTitle').textContent=s.name;
    document.getElementById('recMeta').textContent=s.note;
    document.getElementById('recommendCard').style.background=spotBackground(s,styles[s.cat]);
  });
  markers.push(marker); bounds.push([s.lat,s.lng]);

  const card=document.createElement('button');
  card.className='mini-card';
  card.innerHTML=`<div class="mini-photo">${s.image ? `<img src="${s.image}" alt="${s.name}">` : styles[s.cat].emoji}</div><div class="mini-body"><div class="mini-title">${s.name}</div><div class="mini-meta">${s.tags.join('・')}</div></div>`;
  card.addEventListener('click',()=>focusSpot(s,marker));
  strip.appendChild(card);
 });

 if(bounds.length) map.fitBounds(bounds,{paddingTopLeft:[42,145],paddingBottomRight:[42,70],maxZoom:11});
}

function showCategory(cat){
 activeCat=cat;
 activeSubfilter='すべて';
 activeCafeTime='all';
 document.getElementById('mapHeadTitle').textContent=styles[cat].label;
 buildSubfilters(cat);
 buildCafeTimeFilters(cat);
 renderCategory(cat);
}

document.querySelectorAll('.chip').forEach(btn=>{
 btn.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  showCategory(btn.dataset.cat);
 });
});

const toast=document.getElementById('toast');
function showToast(message){
 toast.textContent=message;toast.classList.add('show');
 clearTimeout(window.__toastTimer);
 window.__toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);
}

document.getElementById('locateBtn').addEventListener('click',()=>{
 if(!navigator.geolocation){showToast('現在地取得に対応していません');return;}
 showToast('現在地を取得中…');
 navigator.geolocation.getCurrentPosition(pos=>{
  const {latitude,longitude,accuracy}=pos.coords;
  if(userMarker) map.removeLayer(userMarker);
  if(userAccuracy) map.removeLayer(userAccuracy);
  userAccuracy=L.circle([latitude,longitude],{radius:accuracy,color:'#4f8cff',weight:1,fillColor:'#4f8cff',fillOpacity:.08}).addTo(map);
  userMarker=L.circleMarker([latitude,longitude],{radius:8,color:'#fff',weight:4,fillColor:'#4285f4',fillOpacity:1}).addTo(map);
  map.setView([latitude,longitude],13,{animate:true});
  showToast('現在地を表示しました');
 },()=>showToast('位置情報を許可すると現在地を表示できます'),{enableHighAccuracy:true,timeout:8000,maximumAge:60000});
});

function openMap(cat){
 document.getElementById('homeScreen').classList.add('hidden');
 document.getElementById('mapScreen').classList.remove('hidden');
 document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));

 // iPhoneのホーム画面Webアプリでは、非表示中にLeafletを描画すると
 // タイルが真っ白になることがあるため、表示後にサイズ確定→描画する。
 requestAnimationFrame(()=>{
   requestAnimationFrame(()=>{
     map.invalidateSize(true);
     showCategory(cat);
     setTimeout(()=>{
       map.invalidateSize(true);
       map.eachLayer(layer=>{
         if(layer && typeof layer.redraw==='function') layer.redraw();
       });
     },220);
   });
 });
}

document.querySelectorAll('[data-go]').forEach(btn=>btn.addEventListener('click',()=>openMap(btn.dataset.go)));
document.querySelectorAll('[data-soon]').forEach(btn=>btn.addEventListener('click',()=>showToast(btn.dataset.soon+'は次のアップデートで追加予定')));
document.getElementById('backBtn').addEventListener('click',()=>{
 document.getElementById('mapScreen').classList.add('hidden');
 document.getElementById('homeScreen').classList.remove('hidden');
});

// 初期状態はホーム画面なので、地図の本描画は openMap() 時に行う。
window.addEventListener('pageshow',()=>{
  if(!document.getElementById('mapScreen').classList.contains('hidden')){
    setTimeout(()=>{
      map.invalidateSize(true);
      map.eachLayer(layer=>{
        if(layer && typeof layer.redraw==='function') layer.redraw();
      });
    },180);
  }
});

if (window.matchMedia('(max-width: 600px)').matches) {
  const zoom = document.querySelector('.leaflet-control-zoom');
  if (zoom) zoom.style.display = 'none';
}
</script>
</body>
</html>
