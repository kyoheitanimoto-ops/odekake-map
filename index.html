<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fffafc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>おでかけMAP 福岡</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    :root{
      --bg:#fffafc;
      --card:#fff;
      --text:#17171c;
      --muted:#7a7a86;
      --line:#ececf2;
      --shadow:0 16px 40px rgba(30,20,40,.12);
      --pink:#ff5f8f;
      --blue:#4f8cff;
      --violet:#7a67ee;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Noto Sans JP",sans-serif;
      background:linear-gradient(180deg,#fff8fb 0%,#f6f7fb 42%,#f5f6fa 100%);
      color:var(--text);
      overflow:hidden;
    }
    .app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
    .top{
      padding:calc(14px + env(safe-area-inset-top)) 18px 8px;
      position:relative;
    }
    .top:after{
      content:"";
      position:absolute;right:-30px;top:-45px;width:150px;height:150px;border-radius:50%;
      background:radial-gradient(circle,#ffd7e5 0%,rgba(255,215,229,0) 70%);
      pointer-events:none;
    }
    .eyebrow{font-size:11px;font-weight:800;color:var(--pink);letter-spacing:.14em;margin-bottom:6px}
    h1{font-size:30px;line-height:1.08;margin:0;letter-spacing:-.04em}
    .sub{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.5}
    .chips{display:flex;gap:9px;overflow-x:auto;padding:10px 14px 8px;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chip{
      border:1px solid var(--line);border-radius:999px;padding:11px 15px;font-size:14px;font-weight:800;
      white-space:nowrap;background:rgba(255,255,255,.92);color:#444;box-shadow:0 4px 12px rgba(20,20,40,.05)
    }
    .chip.active{color:#fff;border-color:transparent;background:#17171c;transform:translateY(-1px)}
    .recommend-wrap{padding:0 14px 10px}
    .recommend-card{
      border-radius:22px;padding:0;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;
      background:linear-gradient(135deg,#ff6a98 0%,#ff8e73 100%);
      min-height:150px;background-size:cover!important;background-position:center!important;
    }
    .recommend-overlay{
      min-height:150px;padding:18px 16px;display:flex;flex-direction:column;justify-content:flex-end;
      background:linear-gradient(180deg,rgba(0,0,0,.05) 10%,rgba(0,0,0,.62) 100%);position:relative;z-index:1;
    }
    .recommend-card:after{display:none}
    .rec-kicker{font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.88}
    .rec-main{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:5px}
    .rec-title{font-size:17px;font-weight:900;line-height:1.2}
    .rec-meta{font-size:11px;opacity:.9;margin-top:5px}
    .rec-badge{background:rgba(255,255,255,.2);backdrop-filter:blur(10px);padding:9px 11px;border-radius:14px;font-size:11px;font-weight:800;white-space:nowrap}
    .map-shell{
      position:relative;flex:1;min-height:0;margin:0 12px 12px;border-radius:28px;overflow:hidden;
      background:#e9e9ef;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.85)
    }
    #map{position:absolute;inset:0}
    .map-toolbar{
      position:absolute;top:14px;left:14px;right:14px;z-index:500;display:flex;justify-content:space-between;gap:8px;pointer-events:none
    }
    .glass{
      pointer-events:auto;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border-radius:999px;padding:9px 12px;font-size:12px;font-weight:850;box-shadow:0 8px 24px rgba(0,0,0,.10)
    }
    .floating{
      position:absolute;right:14px;bottom:18px;z-index:500;width:48px;height:48px;border:none;border-radius:16px;
      background:rgba(255,255,255,.96);box-shadow:0 8px 24px rgba(0,0,0,.16);display:grid;place-items:center;font-size:20px;color:#222
    }
    .pin{
      width:42px;height:42px;border-radius:50% 50% 50% 12px;transform:rotate(-45deg);
      display:grid;place-items:center;border:3px solid #fff
    }
    .pin span{transform:rotate(45deg);font-size:16px}
    .leaflet-div-icon{background:transparent!important;border:none!important}
    .leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.72)!important}
    .leaflet-popup-content-wrapper{border-radius:20px!important;box-shadow:0 16px 38px rgba(0,0,0,.16)!important;padding:2px!important}
    .leaflet-popup-content{margin:14px!important;width:245px!important}
    .popup-visual{
      height:104px;border-radius:14px;margin-bottom:11px;overflow:hidden;display:flex;align-items:center;justify-content:center;
      font-size:26px;font-weight:900;background:linear-gradient(135deg,#ff7da5,#ff9a7a)
    }
    .popup-visual img{width:100%;height:100%;object-fit:cover;display:block}
    .popup-title{font-size:16px;font-weight:900;letter-spacing:-.02em;margin-bottom:6px}
    .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .tag{font-size:10px;font-weight:800;background:#f4f4f7;color:#5c5c66;padding:5px 7px;border-radius:999px}
    .popup-note{font-size:12px;line-height:1.6;color:var(--muted);margin-bottom:12px}
    .gmaps{display:block;text-decoration:none;text-align:center;color:#fff!important;background:#111116;padding:11px 12px;border-radius:12px;font-weight:850;font-size:13px}
    .bottom-strip{
      position:absolute;left:12px;right:72px;bottom:16px;z-index:490;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none
    }
    .bottom-strip::-webkit-scrollbar{display:none}
    .mini-card{
      min-width:165px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border:none;border-radius:16px;padding:0;text-align:left;
      overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.12)
    }
    .mini-photo{height:72px;background:#ececf2;display:flex;align-items:center;justify-content:center;font-size:24px}
    .mini-photo img{width:100%;height:100%;object-fit:cover;display:block}
    .mini-body{padding:9px 11px}
    .mini-title{font-size:12px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mini-meta{font-size:10px;color:var(--muted);margin-top:4px}
    .toast{
      position:absolute;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);z-index:800;background:#111116;color:#fff;
      padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="eyebrow">FUKUOKA GUIDE</div>
    <h1>今日は、どこ行く？</h1>
    <div class="sub">目的を選ぶだけ。おすすめだけを地図に出します。</div>
  </div>

  <div class="chips">
    <button class="chip active" data-cat="date">❤️ デート</button>
    <button class="chip" data-cat="kids">🎈 子育て</button>
    <button class="chip" data-cat="solo">🧳 一人旅</button>
  </div>

  <div class="recommend-wrap">
    <div class="recommend-card" id="recommendCard">
      <div class="recommend-overlay">
      <div class="rec-kicker">TODAY'S PICK</div>
      <div class="rec-main">
        <div>
          <div class="rec-title" id="recTitle">福岡タワー</div>
          <div class="rec-meta" id="recMeta">夜景デートの定番</div>
        </div>
        <div class="rec-badge" id="recBadge">❤️ デート</div>
      </div>
      </div>
    </div>
  </div>

  <div class="map-shell">
    <div id="map"></div>
    <div class="map-toolbar">
      <div class="glass" id="spotCount">4スポット</div>
      <div class="glass" id="categoryLabel">デート向け</div>
    </div>
    <div class="bottom-strip" id="bottomStrip"></div>
    <button class="floating" id="locateBtn" aria-label="現在地を表示">◎</button>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const spots = [
 {name:"福岡タワー",cat:"date",lat:33.5933,lng:130.3515,note:"夜景デートの定番。海沿い散歩とセットにも。",tags:["夜景","王道"],image:"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Fukuoka_Tower.JPG/960px-Fukuoka_Tower.JPG"},
 {name:"大濠公園",cat:"date",lat:33.5861,lng:130.3764,note:"カフェや散歩をゆっくり楽しみたい日に。",tags:["散歩","カフェ"],image:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Ohori_Park%2C_Fukuoka.JPG/1280px-Ohori_Park%2C_Fukuoka.JPG"},
 {name:"海の中道海浜公園",cat:"date",lat:33.6635,lng:130.3613,note:"のんびり一日デート。季節ごとの景色も魅力。",tags:["自然","一日"]},
 {name:"門司港レトロ",cat:"date",lat:33.9477,lng:130.9610,note:"街歩きと夜景を楽しめる定番スポット。",tags:["街歩き","夜景"]},
 {name:"マリンワールド海の中道",cat:"kids",lat:33.6616,lng:130.3639,note:"家族で楽しみやすい水族館。雨の日にも候補。",tags:["雨OK","水族館"]},
 {name:"福岡市科学館",cat:"kids",lat:33.5772,lng:130.3780,note:"室内中心で、天気を気にせず遊びやすい。",tags:["室内","雨OK"]},
 {name:"海の中道海浜公園",cat:"kids",lat:33.6635,lng:130.3613,note:"広い公園で思い切り遊びたい日に。",tags:["公園","広い"]},
 {name:"北九州市立いのちのたび博物館",cat:"kids",lat:33.8704,lng:130.8113,note:"恐竜や自然史が好きな子どもにもおすすめ。",tags:["恐竜","学び"]},
 {name:"太宰府天満宮",cat:"solo",lat:33.5214,lng:130.5349,note:"参道を歩きながら、気ままにひとり散策。",tags:["散策","定番"],image:"https://upload.wikimedia.org/wikipedia/commons/thumb/3/39/Dazaifu_Tenmangu.jpg/1280px-Dazaifu_Tenmangu.jpg"},
 {name:"大濠公園",cat:"solo",lat:33.5861,lng:130.3764,note:"一人で歩いたり、ベンチで休憩したりしやすい。",tags:["散歩","休憩"],image:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Ohori_Park%2C_Fukuoka.JPG/1280px-Ohori_Park%2C_Fukuoka.JPG"},
 {name:"門司港レトロ",cat:"solo",lat:33.9477,lng:130.9610,note:"写真を撮りながら自由に街歩き。",tags:["写真","街歩き"]},
 {name:"糸島・桜井二見ヶ浦",cat:"solo",lat:33.6380,lng:130.1927,note:"海沿いの景色を楽しみたいひとりドライブに。",tags:["海","ドライブ"]}
];

const styles={
 date:{color:"#ff5f8f",emoji:"❤️",label:"デート向け",grad:"linear-gradient(135deg,#ff6a98,#ff8e73)"},
 kids:{color:"#4f8cff",emoji:"🎈",label:"子育て向け",grad:"linear-gradient(135deg,#4f8cff,#68c9ff)"},
 solo:{color:"#7a67ee",emoji:"🧳",label:"一人旅向け",grad:"linear-gradient(135deg,#7a67ee,#a06cf2)"}
};

const map=L.map('map',{zoomControl:false}).setView([33.5902,130.4017],10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
L.control.zoom({position:'bottomleft'}).addTo(map);

let markers=[], userMarker=null, userAccuracy=null, activeCat='date';

function makeIcon(cat){
 const s=styles[cat];
 return L.divIcon({
  className:'leaflet-div-icon',
  html:`<div class="pin" style="background:${s.color};box-shadow:0 7px 18px ${s.color}66"><span>${s.emoji}</span></div>`,
  iconSize:[42,42],iconAnchor:[21,39],popupAnchor:[0,-34]
 });
}

function popupHtml(s){
 const st=styles[s.cat];
 const tags=s.tags.map(t=>`<span class="tag">${t}</span>`).join('');
 const q=encodeURIComponent(s.name);
 return `
  <div class="popup-visual" style="background:${st.grad}">${s.image ? `<img src="${s.image}" alt="${s.name}">` : st.emoji}</div>
  <div class="popup-title">${s.name}</div>
  <div class="tags">${tags}</div>
  <div class="popup-note">${s.note}</div>
  <a class="gmaps" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">Googleマップで見る</a>`;
}

function focusSpot(s, marker){
 map.flyTo([s.lat,s.lng],13,{duration:.55});
 marker.openPopup();
 document.getElementById('recTitle').textContent=s.name;
 document.getElementById('recMeta').textContent=s.note;
 document.getElementById('recommendCard').style.background=spotBackground(s,styles[s.cat]);
}

function spotBackground(s,st){
 return s.image ? 'linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.22)), url("' + s.image + '")' : st.grad;
}

function showCategory(cat){
 activeCat=cat;
 markers.forEach(m=>map.removeLayer(m)); markers=[];
 const chosen=spots.filter(s=>s.cat===cat);
 const st=styles[cat];
 document.getElementById('spotCount').textContent=`${chosen.length}スポット`;
 document.getElementById('categoryLabel').textContent=st.label;
 document.getElementById('recommendCard').style.background=spotBackground(chosen[0],st);
 document.getElementById('recBadge').textContent=`${st.emoji} ${st.label.replace('向け','')}`;
 document.getElementById('recTitle').textContent=chosen[0].name;
 document.getElementById('recMeta').textContent=chosen[0].note;

 const strip=document.getElementById('bottomStrip');
 strip.innerHTML='';
 const bounds=[];

 chosen.forEach((s,i)=>{
  const marker=L.marker([s.lat,s.lng],{icon:makeIcon(cat)}).addTo(map);
  marker.bindPopup(popupHtml(s));
  marker.on('click',()=>{
    document.getElementById('recTitle').textContent=s.name;
    document.getElementById('recMeta').textContent=s.note;
    document.getElementById('recommendCard').style.background=spotBackground(s,styles[s.cat]);
  });
  markers.push(marker); bounds.push([s.lat,s.lng]);

  const card=document.createElement('button');
  card.className='mini-card';
  card.innerHTML=`<div class="mini-photo">${s.image ? `<img src="${s.image}" alt="${s.name}">` : styles[s.cat].emoji}</div><div class="mini-body"><div class="mini-title">${s.name}</div><div class="mini-meta">${s.tags.join('・')}</div></div>`;
  card.addEventListener('click',()=>focusSpot(s,marker));
  strip.appendChild(card);
 });

 if(bounds.length) map.fitBounds(bounds,{padding:[54,54],maxZoom:11});
}

document.querySelectorAll('.chip').forEach(btn=>{
 btn.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  showCategory(btn.dataset.cat);
 });
});

const toast=document.getElementById('toast');
function showToast(message){
 toast.textContent=message;toast.classList.add('show');
 clearTimeout(window.__toastTimer);
 window.__toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);
}

document.getElementById('locateBtn').addEventListener('click',()=>{
 if(!navigator.geolocation){showToast('現在地取得に対応していません');return;}
 showToast('現在地を取得中…');
 navigator.geolocation.getCurrentPosition(pos=>{
  const {latitude,longitude,accuracy}=pos.coords;
  if(userMarker) map.removeLayer(userMarker);
  if(userAccuracy) map.removeLayer(userAccuracy);
  userAccuracy=L.circle([latitude,longitude],{radius:accuracy,color:'#4f8cff',weight:1,fillColor:'#4f8cff',fillOpacity:.08}).addTo(map);
  userMarker=L.circleMarker([latitude,longitude],{radius:8,color:'#fff',weight:4,fillColor:'#4285f4',fillOpacity:1}).addTo(map);
  map.setView([latitude,longitude],13,{animate:true});
  showToast('現在地を表示しました');
 },()=>showToast('位置情報を許可すると現在地を表示できます'),{enableHighAccuracy:true,timeout:8000,maximumAge:60000});
});

showCategory('date');
</script>
</body>
</html>
