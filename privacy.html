<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://mycocomo.pages.dev/privacy.html">
  <title>プライバシーについて｜myCocomo</title>
  <noscript><meta http-equiv="refresh" content="0;url=https://mycocomo.pages.dev/privacy.html"></noscript>
  <style>
    :root{color-scheme:light;--bg:#fffafc;--text:#20232a;--accent:#d95e7e}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
    main{width:min(520px,100%);padding:28px;border-radius:22px;background:#fff;box-shadow:0 12px 36px rgba(30,35,45,.1);text-align:center}
    h1{font-size:22px;line-height:1.5;margin:0 0 10px}
    p{font-size:15px;line-height:1.8;margin:0 0 18px}
    a{display:inline-block;padding:12px 18px;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <h1>myCocomoのURLが新しくなりました</h1>
    <p>プライバシーについては新しいURLでご覧いただけます。自動で移動しない場合は、下のボタンを押してください。</p>
    <a href="https://mycocomo.pages.dev/privacy.html" id="continue-link">新しいURLを開く</a>
  </main>
  <script>
  (function(){
    "use strict";
    var oldHost = "kyoheitanimoto-ops.github.io";
    var allowedPaths = ["/odekake-map/privacy.html"];
    var destination = new URL("https://mycocomo.pages.dev/privacy.html");
    if (window.location.hostname !== oldHost) return;
    if (!allowedPaths.includes(window.location.pathname)) return;
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    window.location.replace(destination.href);
  })();
  </script>
</body>
</html>
